<h1>{{ 'ADD_TOOL_PAGE.TITLE' | translate }}</h1>

<label for="category">{{ 'ADD_TOOL_PAGE.CATEGORY' | translate }}</label>
<select id="category" (change)="onCategoryChange($event)">
  <option value="">{{ 'ADD_TOOL_PAGE.SELECT_CATEGORY' | translate }}</option>
  @for (category of  categories; track category) {
    <option [value]="category">{{ 'CATEGORIES.' + category | translate }}</option>
  }
</select>

<label for="tool">{{ 'ADD_TOOL_PAGE.TOOL' | translate }}</label>
<select id="tool" [disabled]="!selectedCategory()">
  <option value="">{{ 'ADD_TOOL_PAGE.SELECT_TOOL' | translate }}</option>
  @for (tool of availableTools(); track tool) {
    <option [value]="tool">{{ 'TOOLS.' + tool | translate }}</option>
  }
</select>
